[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jeux-rpg"
version = "0.11.0a24"
description = "Prototype RPG multijoueur autonome"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0,<2", "fastapi>=0.115,<1", "redis>=5,<9", "uvicorn>=0.30,<1", "websockets>=13,<17"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pydantic>=2,<3", "httpx>=0.27,<1"]
load = ["locust>=2.43.3,<3"]

[project.scripts]
jeux-rpg = "jeuxRPG.multiplayer.server:main"
jeux-rpg-controller = "jeuxRPG.multiplayer.controller:main"
jeux-rpg-map-editor = "jeuxRPG.multiplayer.map_editor:main"

[tool.vercel]
entrypoint = "app:app"

[tool.setuptools.packages.find]
include = ["jeuxRPG*"]

[tool.setuptools.package-data]
jeuxRPG = ["_class/**/*.json", "i18n/translations/*.json", "multiplayer/web/*", "multiplayer/migrations/*.sql", "maps/*.json", "_balance/**/*.json", "resources/**/*.json"]
