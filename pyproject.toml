[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jeux-rpg"
version = "0.11.0a25"
description = "Prototype RPG multijoueur autonome"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0,<2", "fastapi>=0.115,<1", "redis>=5,<9", "uvicorn>=0.30,<1", "websockets>=13,<17"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-timeout>=2.3,<3", "pydantic>=2,<3", "httpx>=0.27,<1"]
load = ["locust>=2.43.3,<3"]

[project.scripts]
jeux-rpg = "jeuxRPG.multiplayer.server:main"
jeux-rpg-controller = "jeuxRPG.multiplayer.controller:main"
jeux-rpg-map-editor = "jeuxRPG.multiplayer.map_editor:main"

[tool.vercel]
entrypoint = "app:app"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Historical violations inventoried on 2026-10-11; critical runtime files have no exemption.
