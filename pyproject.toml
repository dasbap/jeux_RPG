[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jeux-rpg"
version = "0.11.0a3"
description = "Prototype RPG multijoueur autonome"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
load = ["locust>=2.43.3,<3"]

[project.scripts]
jeux-rpg = "jeuxRPG.multiplayer.server:main"
jeux-rpg-map-editor = "jeuxRPG.multiplayer.map_editor:main"
