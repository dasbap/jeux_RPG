[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jeuxRPG"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1,<2", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=7,<8", "coverage>=7.10,<8", "pytest-timeout>=2,<3", "ruff>=0.16,<0.17"]

[project.scripts]
jeux-rpg = "jeuxRPG.cli:main"

[tool.setuptools.packages.find]
include = ["jeuxRPG*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "samples/*.json", "sets/*.json"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["jeuxRPG"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 75
