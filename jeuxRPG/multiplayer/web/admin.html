<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Jeux RPG</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head>
<body><main>
<header><div><p class="eyebrow">Jeux RPG · Alpha</p><h1>Gestion des comptes</h1></div><a href="/">Retour au jeu</a></header>
<section id="login"><h2>Accès administrateur</h2><form id="login-form"><label for="admin-token">Clé administrateur</label><input id="admin-token" type="password" required autocomplete="off"><button>Se connecter</button></form></section>
<section id="panel" hidden><div class="toolbar"><form id="search-form"><label for="search">Rechercher un nom ou un identifiant</label><div><input id="search" maxlength="64" type="search"><button>Rechercher</button></div></form><button id="logout" class="secondary">Se déconnecter</button></div><p id="count"></p><div class="table-wrap"><table><thead><tr><th>Compte</th><th>Classe</th><th>État</th><th>Actions</th></tr></thead><tbody id="accounts"></tbody></table></div><nav aria-label="Pages de comptes"><button id="previous" class="secondary">Précédent</button><button id="next" class="secondary">Suivant</button></nav></section>
<section id="edit" hidden><h2 id="edit-title"></h2><p id="edit-description"></p><form id="edit-form"><label id="name-label" for="new-name">Nouveau nom</label><input id="new-name" maxlength="32"><div class="actions"><button id="confirm-action">Confirmer</button><button id="cancel-action" class="secondary" type="button">Annuler</button></div></form></section>
<p id="status" role="status" aria-live="polite"></p>
</main></body></html>
