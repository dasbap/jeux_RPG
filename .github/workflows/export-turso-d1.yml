name: Export prive Turso pour migration D1
on:
  workflow_dispatch:
    inputs:
      freeze_writes:
        description: Verrouiller les anciens moteurs apres pause et drainage du trafic
        required: true
        default: false
        type: boolean
      restore_fence:
        description: Retour avant toute ecriture D1 uniquement - generation precedente du rapport de gel
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: turso-private-export
  cancel-in-progress: false
jobs:
  export:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuser deux operations de verrouillage simultanees
        if: inputs.freeze_writes && inputs.restore_fence != ''
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt .
      - run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Verrouiller Turso uniquement pour la bascule finale autorisee
        if: inputs.freeze_writes
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m scripts.freeze_turso_writes > freeze-check.json
      - name: Retablir la source uniquement pour un abandon de bascule
        if: inputs.restore_fence != ''
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RESTORE_FENCE: ${{ inputs.restore_fence }}
        run: python -m scripts.freeze_turso_writes --restore-fence "$RESTORE_FENCE" > freeze-check.json
      - name: Exporter en lecture seule et chiffrer
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BACKUP_RECIPIENT: ${{ vars.D1_MIGRATION_BACKUP_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$TURSO_DATABASE_URL" && test -n "$TURSO_AUTH_TOKEN"
          [[ "$BACKUP_RECIPIENT" =~ ^age1[a-z0-9]{58}$ ]]
          trap 'rm -f "$RUNNER_TEMP/d1-source.sqlite3"' EXIT
          python -m scripts.export_turso_backup "$RUNNER_TEMP/d1-source.sqlite3" > export-check.json
          age -r "$BACKUP_RECIPIENT" -o d1-source.sqlite3.age "$RUNNER_TEMP/d1-source.sqlite3"
          sha256sum d1-source.sqlite3.age > export-checksum.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d1-private-source
          path: |
            d1-source.sqlite3.age
            export-check.json
            export-checksum.txt
            freeze-check.json
          retention-days: 7
          if-no-files-found: error
