name: Export Turso vers D1 (chiffre)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: turso-private-export
  cancel-in-progress: false
jobs:
  export:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Installer les dependances et age
        run: |
          python -m pip install -c constraints.txt .
          sudo apt-get update -qq
          sudo apt-get install -y age
      - name: Exporter, verifier et chiffrer sans exposer les donnees
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          if [[ ! "$BACKUP_AGE_RECIPIENT" =~ ^age1[a-z0-9]{58}$ ]]; then
            echo "Configurer la variable d'environnement production BACKUP_AGE_RECIPIENT (cle publique age)."
            exit 1
          fi
          if [[ -z "$TURSO_DATABASE_URL" || -z "$TURSO_AUTH_TOKEN" ]]; then
            echo "Secrets Turso manquants."
            exit 1
          fi
          trap 'rm -f backup.sqlite3 d1-import.sql' EXIT
          python -m scripts.export_turso_backup backup.sqlite3
          python -m scripts.prepare_d1_import backup.sqlite3 d1-import.sql
          age -r "$BACKUP_AGE_RECIPIENT" -o backup.sqlite3.age backup.sqlite3
          age -r "$BACKUP_AGE_RECIPIENT" -o d1-import.sql.age d1-import.sql
      - name: Publier uniquement les fichiers chiffres
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turso-d1-chiffre
          path: |
            backup.sqlite3.age
            d1-import.sql.age
          if-no-files-found: error
          retention-days: 1
