name: Render preview sauvegarde et surveillance
on:
  schedule:
    - cron: '35 4 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
  workflow_call:
    secrets:
      render_test_d1_token:
        required: false
permissions:
  contents: read
concurrency:
  group: jeux-rpg-render-preview
  cancel-in-progress: false
jobs:
  monitor:
    # Manual only: scheduled monitoring would wake an idle Free service.
    if: github.event_name == 'workflow_dispatch' && vars.RENDER_AUTOMATION_ENABLED == 'true' && vars.RENDER_ENGINE_URL != ''
    environment: render-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verifier la disponibilite publique du moteur
        env:
          ENGINE_URL: ${{ vars.RENDER_ENGINE_URL }}
        run: |
          [[ $ENGINE_URL =~ ^https://[a-zA-Z0-9.-]+/?$ ]]
          curl --fail --show-error --silent --retry 4 --retry-delay 20 --retry-all-errors --max-time 20 "${ENGINE_URL%/}/ready" | python3 -c 'import json,sys; assert json.load(sys.stdin).get("status") == "ready"'
  backup:
    if: vars.RENDER_AUTOMATION_ENABLED == 'true'
    environment: render-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RPG_DATABASE_BACKEND: d1
      RPG_D1_WORKER_URL: https://jeux-rpg-oracle-test.dasbap-jeux-rpg.workers.dev
      RPG_D1_SERVICE_TOKEN: ${{ secrets.render_test_d1_token || secrets.RENDER_TEST_D1_SERVICE_TOKEN || secrets.RPG_D1_SERVICE_TOKEN }}
      RPG_BACKUP_RECIPIENT: ${{ vars.RPG_BACKUP_RECIPIENT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt .
      - run: sudo apt-get update -q && sudo apt-get install -y age
      - name: Exporter, restaurer pour controle, puis chiffrer hors moteur
        shell: bash
        run: |
          set -euo pipefail
          [[ -n $RPG_BACKUP_RECIPIENT && ${#RPG_D1_SERVICE_TOKEN} -ge 32 ]]
          umask 077
          backup_sqlite=$(mktemp "$RUNNER_TEMP/render-backup-XXXXXX.sqlite3")
          rm -f "$backup_sqlite"
          trap 'rm -f "$backup_sqlite"' EXIT
          mkdir -p "$RUNNER_TEMP/encrypted-backup"
          python -m scripts.export_database_backup "$backup_sqlite" > "$RUNNER_TEMP/encrypted-backup/verification.json"
          age -r "$RPG_BACKUP_RECIPIENT" -o "$RUNNER_TEMP/encrypted-backup/world.sqlite3.age" "$backup_sqlite"
          cd "$RUNNER_TEMP/encrypted-backup"
          sha256sum world.sqlite3.age > world.sqlite3.age.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: render-preview-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/encrypted-backup/
          if-no-files-found: error
          retention-days: 14
