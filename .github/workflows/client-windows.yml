name: Client Windows
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'build-client.cmd'
      - 'scripts/prepare_desktop_client.py'
      - 'scripts/verify_desktop.cjs'
      - 'jeuxRPG/**'
      - '.github/workflows/client-windows.yml'
permissions:
  contents: read
jobs:
  client:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Construire depuis les sources web en une commande
        run: .\build-client.cmd
      - name: Verifier le pont API et les fichiers embarques
        run: npm --prefix desktop test
      - run: npm install --prefix .ui-test playwright@1.56.1
      - name: Verifier le client compile sans reseau et sa sauvegarde
        run: node scripts/verify_desktop.cjs --packaged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Jeux-RPG-Windows-x64
          path: dist/client/Jeux-RPG.exe
          if-no-files-found: error
          retention-days: 14
