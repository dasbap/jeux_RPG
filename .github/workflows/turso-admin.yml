name: Administration Turso
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Action sur la base Turso
        required: true
        default: connexion
        type: choice
        options: [connexion, schema, integrite, initialiser]
permissions:
  contents: read
concurrency:
  group: turso-administration
  cancel-in-progress: false
jobs:
  administration:
    if: github.ref == 'refs/heads/deploy/production'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt .
      - name: Verifier, administrer et verifier l'integrite
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_OPERATION: ${{ inputs.operation }}
        run: |
          python -m jeuxRPG.multiplayer.turso_admin connexion
          python -m jeuxRPG.multiplayer.turso_admin "$TURSO_OPERATION"
          python -m jeuxRPG.multiplayer.turso_admin integrite
