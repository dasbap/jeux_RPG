name: Administration Turso
on:
  push:
    branches: [alpha-vercel-turso]
    paths:
      - jeuxRPG/multiplayer/schema.py
      - jeuxRPG/multiplayer/turso.py
      - jeuxRPG/multiplayer/turso_admin.py
      - .github/workflows/turso-admin.yml
  workflow_dispatch:
    inputs:
      operation:
        description: Action sur la base Turso
        required: true
        default: connexion
        type: choice
        options:
          - connexion
          - schema
          - integrite
          - initialiser
permissions:
  contents: read
concurrency:
  group: turso-administration
  cancel-in-progress: false
jobs:
  administration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TURSO_OPERATION: ${{ inputs.operation || 'initialiser' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Verifier la connexion
        run: python -m jeuxRPG.multiplayer.turso_admin connexion
      - name: Executer l'action Turso
        run: python -m jeuxRPG.multiplayer.turso_admin "$TURSO_OPERATION"
      - name: Verifier l'integrite
        run: python -m jeuxRPG.multiplayer.turso_admin integrite
