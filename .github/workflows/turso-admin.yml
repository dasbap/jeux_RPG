name: Administration Turso
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Action sur la base Turso
        required: true
        default: connexion
        type: choice
        options:
          - connexion
          - schema
          - integrite
permissions:
  contents: read
concurrency:
  group: turso-administration
  cancel-in-progress: false
jobs:
  administration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TURSO_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executer le controle Turso
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit

          queries = {
              "connexion": "SELECT 1 AS connexion",
              "schema": "SELECT type, name, sql FROM sqlite_schema WHERE name NOT LIKE 'sqlite_%' ORDER BY type, name",
              "integrite": "PRAGMA quick_check",
          }
          operation = os.environ["TURSO_OPERATION"]
          token = os.environ.get("TURSO_AUTH_TOKEN", "")
          url = urlsplit(os.environ.get("TURSO_DATABASE_URL", ""))
          if operation not in queries:
              sys.exit("Operation inconnue")
          if not token or any(ord(c) < 33 for c in token):
              sys.exit("Secret TURSO_AUTH_TOKEN absent ou invalide")
          if url.scheme not in ("libsql", "https") or not url.hostname or url.username or url.password or url.port not in (None, 443) or url.path not in ("", "/") or url.query or url.fragment:
              sys.exit("TURSO_DATABASE_URL absent ou invalide")
          payload = {
              "requests": [
                  {"type": "execute", "stmt": {"sql": queries[operation], "want_rows": True}},
                  {"type": "close"},
              ]
          }
          request = urllib.request.Request(
              "https://" + url.hostname + "/v2/pipeline",
              data=json.dumps(payload).encode(),
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              method="POST",
          )
          try:
              opener = urllib.request.build_opener(type("NoRedirect", (urllib.request.HTTPRedirectHandler,), {"redirect_request": lambda *args: None})())
              with opener.open(request, timeout=30) as response:
                  raw = response.read(1024 * 1024 + 1)
              if len(raw) > 1024 * 1024:
                  raise ValueError()
              results = json.loads(raw)["results"]
              if len(results) != 2 or any(item["type"] != "ok" for item in results):
                  raise ValueError()
              result = results[0]["response"]["result"]
              rows = [[value.get("value") for value in row] for row in result["rows"]]
              if operation == "connexion" and rows != [["1"]]:
                  raise ValueError()
              if operation == "integrite" and rows != [["ok"]]:
                  sys.exit("Controle d'integrite en echec")
          except urllib.error.HTTPError as error:
              explanations = {
                  401: "authentification refusee : utiliser un jeton de base (turso db tokens create), pas un jeton API de gestion ; verifier aussi la base cible et l'expiration",
                  403: "acces refuse : verifier les permissions du jeton sur cette base",
                  404: "endpoint introuvable : verifier l'URL de la base",
                  429: "limite de requetes atteinte : reessayer plus tard",
              }
              explanation = explanations.get(error.code, "requete refusee par le serveur Turso")
              sys.exit(f"Echec Turso HTTP {error.code} : {explanation}")
          except (urllib.error.URLError, TimeoutError):
              sys.exit("Echec reseau Turso : verifier DNS, TLS et disponibilite de la base")
          except (ValueError, KeyError, TypeError, IndexError):
              sys.exit("Reponse Turso inattendue : erreur SQL ou format de reponse invalide")
          output = json.dumps({"operation": operation, "colonnes": [col["name"] for col in result["cols"]], "lignes": rows}, ensure_ascii=False, indent=2)
          output = output.replace(token, "[masque]").replace(os.environ["TURSO_DATABASE_URL"], "[URL masquee]")
          print(output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("Controle Turso termine : " + operation + ".\n")
          PY
