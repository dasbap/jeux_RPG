name: Parcours UI du monde actuel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authored-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: npm install --prefix .ui-test jsdom@26.1.0
      - run: python scripts/demo_authored_ui.py | tee demo-ui.log
        env:
          NODE_PATH: ${{ github.workspace }}/.ui-test/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parcours-client
          path: demo-ui.log
