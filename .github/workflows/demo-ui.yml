name: Parcours UI du monde actuel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authored-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: npm install --prefix .ui-test jsdom@26.1.0
      - run: python scripts/demo_authored_ui.py | tee demo-ui.log
        env:
          NODE_PATH: ${{ github.workspace }}/.ui-test/node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parcours-client
          path: demo-ui.log
