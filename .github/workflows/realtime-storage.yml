name: Controle stockage temps reel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/prod'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --prefix .tools vercel@62.2.0
      - name: Cibler jeux-rpg
        run: |
          mkdir -p .vercel
          node -e 'require("fs").writeFileSync(".vercel/project.json", JSON.stringify({projectId:"prj_fVH6vG7RCXf5OP3MIfTngxeCN8U2",orgId:"team_qde9V6kikwwSvLtNrjAsAkRY",projectName:"jeux-rpg"}))'
      - name: Lister les integrations existantes
        run: .tools/node_modules/.bin/vercel integration list
      - name: Decouvrir le stockage disponible
        run: .tools/node_modules/.bin/vercel integration discover --category storage
