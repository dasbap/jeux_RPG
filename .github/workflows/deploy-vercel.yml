name: Publication Vercel jeux-rpg
on:
  push:
    branches:
      - prod
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jeux-rpg-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      RPG_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Verifier l'acces de deploiement
        env:
          RPG_BACKUP_RECIPIENT: ${{ vars.RPG_BACKUP_RECIPIENT }}
          RPG_ADMIN_TOKEN: ${{ secrets.RPG_ADMIN_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$RPG_BACKUP_RECIPIENT" ]; then
            echo "Variable publique RPG_BACKUP_RECIPIENT absente : configurer la cle age du proprietaire avant toute mutation de production."
            exit 1
          fi
          if [ "${#RPG_ADMIN_TOKEN}" -lt 32 ]; then
            echo "Secret GitHub production RPG_ADMIN_TOKEN absent ou trop court : requis pour le controle du build prebuilt ; ne pas afficher sa valeur."
            exit 1
          fi
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Secret GitHub Actions VERCEL_TOKEN absent : nécessaire pour publier le projet Vercel existant jeux-rpg."
            exit 1
          fi
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "Secret GitHub Actions VERCEL_AUTOMATION_BYPASS_SECRET absent : nécessaire pour vérifier le déploiement protégé avant promotion."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Installer uv pour le build Python Vercel
        run: python -m pip install uv==0.13.0
      - run: python -m pip install -c constraints.txt '.[test]'
      - run: python -m pytest -q
      - run: npm install --prefix .deploy-tools vercel@62.2.0 jsdom@26.1.0
      - name: Verifier l'interface admin
        run: node scripts/verify_admin_ui.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/.deploy-tools/node_modules
      - name: Verifier la quete de Mira
        run: node scripts/verify_ui_mira.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/.deploy-tools/node_modules
      - name: Verifier le transport
        run: node scripts/verify_transport.cjs
      - name: Verifier le polling adaptatif
        run: node scripts/verify_polling.cjs
      - name: Verifier les commandes tactiles
        run: node scripts/verify_touch_controls.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/.deploy-tools/node_modules
      - name: Installer le chiffrement de sauvegarde
        run: sudo apt-get update && sudo apt-get install --yes age
      - name: Exporter et restaurer Turso avant migration
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RPG_BACKUP_RECIPIENT: ${{ vars.RPG_BACKUP_RECIPIENT }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/production-before.sqlite3"' EXIT
          python -m scripts.export_turso_backup "$RUNNER_TEMP/production-before.sqlite3" > backup-check.json
          age -r "$RPG_BACKUP_RECIPIENT" -o production-before.sqlite3.age "$RUNNER_TEMP/production-before.sqlite3"
          sha256sum production-before.sqlite3.age > backup-checksum.txt
      - name: Conserver uniquement la sauvegarde chiffree hors production
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turso-before-${{ github.sha }}
          path: |
            production-before.sqlite3.age
            backup-checksum.txt
            backup-check.json
          retention-days: 30
          if-no-files-found: error
      - name: Initialiser et verifier la base Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -m jeuxRPG.multiplayer.turso_admin initialiser
          python -m jeuxRPG.multiplayer.turso_admin integrite
      - name: Cibler exclusivement jeux-rpg
        run: |
          mkdir -p .vercel
          python - <<'PY'
          import json
          from pathlib import Path
          Path('.vercel/project.json').write_text(json.dumps({'projectId': 'prj_fVH6vG7RCXf5OP3MIfTngxeCN8U2', 'orgId': 'team_qde9V6kikwwSvLtNrjAsAkRY', 'projectName': 'jeux-rpg'}))
          PY
      - name: Synchroniser les acces Turso valides vers Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RPG_ADMIN_TOKEN: ${{ secrets.RPG_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          values = {key: os.environ[key] for key in ('TURSO_DATABASE_URL', 'TURSO_AUTH_TOKEN', 'RPG_ADMIN_TOKEN')}
          for key, value in values.items():
              subprocess.run(['.deploy-tools/node_modules/.bin/vercel', 'env', 'add', key, 'production', '--force', '--sensitive'], input=value, text=True, check=True)
          for key, value in {'RPG_RESET_TEST_PLAYERS': '0', 'RPG_RUNTIME_REALMS': '1'}.items():
              subprocess.run(['.deploy-tools/node_modules/.bin/vercel', 'env', 'add', key, 'production', '--force', '--no-sensitive'], input=value, text=True, check=True)
          PY
      - name: Recuperer la configuration de build du projet exact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: .deploy-tools/node_modules/.bin/vercel pull --yes --environment=production --scope team_qde9V6kikwwSvLtNrjAsAkRY
      - name: Completer la configuration locale du build avec les secrets CI
        run: python -m scripts.prepare_vercel_environment
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RPG_ADMIN_TOKEN: ${{ secrets.RPG_ADMIN_TOKEN }}
      - name: Verifier le stockage du moteur de production
        run: python -m scripts.verify_runtime_storage
      - name: Construire l'artefact de production en CI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RPG_RELEASE_SHA: ${{ github.sha }}
          RPG_ADMIN_TOKEN: ${{ secrets.RPG_ADMIN_TOKEN }}
        run: .deploy-tools/node_modules/.bin/vercel build --prod
      - name: Preparer la version de production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: .deploy-tools/node_modules/.bin/vercel deploy --prebuilt --prod --skip-domain --yes --env RPG_RELEASE_SHA="$GITHUB_SHA" > deployment-url.txt
      - name: Verifier les routes et la connexion admin en ligne
        run: python scripts/verify_deployment.py
        env:
          RPG_EXPECTED_RELEASE: ${{ github.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Promouvoir la version verifiee
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: .deploy-tools/node_modules/.bin/vercel promote "$(cat deployment-url.txt)" --yes
      - name: Supprimer la configuration locale contenant les secrets CI
        if: always()
        run: rm -f .vercel/.env.production.local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deployment-jeux-rpg
          path: deployment-url.txt
