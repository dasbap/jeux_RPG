name: Publication Vercel jeux-rpg
on:
  push:
    branches:
      - prod
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jeux-rpg-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      RPG_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Verifier l'acces de deploiement
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Secret GitHub Actions VERCEL_TOKEN absent : nécessaire pour publier le projet Vercel existant jeux-rpg."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m pip install -c constraints.txt '.[test]'
      - run: python -m pytest -q
      - run: npm install --prefix .deploy-tools vercel@62.2.0 jsdom@26.1.0
      - name: Verifier l'interface admin
        run: node scripts/verify_admin_ui.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/.deploy-tools/node_modules
      - name: Verifier la quete de Mira
        run: node scripts/verify_ui_mira.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/.deploy-tools/node_modules
      - name: Verifier le transport
        run: node scripts/verify_transport.cjs
      - name: Verifier le polling adaptatif
        run: node scripts/verify_polling.cjs
      - name: Verifier les commandes tactiles
        run: node scripts/verify_touch_controls.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/.deploy-tools/node_modules
      - name: Initialiser et verifier la base Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -m jeuxRPG.multiplayer.turso_admin initialiser
          python -m jeuxRPG.multiplayer.turso_admin integrite
      - name: Cibler exclusivement jeux-rpg
        run: |
          mkdir -p .vercel
          python - <<'PY'
          import json
          from pathlib import Path
          Path('.vercel/project.json').write_text(json.dumps({'projectId': 'prj_fVH6vG7RCXf5OP3MIfTngxeCN8U2', 'orgId': 'team_qde9V6kikwwSvLtNrjAsAkRY', 'projectName': 'jeux-rpg'}))
          PY
      - name: Synchroniser les acces Turso valides vers Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          values = {key: os.environ[key] for key in ('TURSO_DATABASE_URL', 'TURSO_AUTH_TOKEN')}
          values.update(RPG_RESET_TEST_PLAYERS='0', RPG_RUNTIME_REALMS='1')
          for key, value in values.items():
              subprocess.run(['.deploy-tools/node_modules/.bin/vercel', 'env', 'add', key, 'production', '--force', '--sensitive'], input=value, text=True, check=True)
          PY
      - name: Preparer la version de production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: .deploy-tools/node_modules/.bin/vercel deploy --prod --skip-domain --yes --env RPG_RELEASE_SHA="$GITHUB_SHA" > deployment-url.txt
      - name: Verifier les routes et la connexion admin en ligne
        run: python scripts/verify_deployment.py
        env:
          RPG_EXPECTED_RELEASE: ${{ github.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Promouvoir la version verifiee
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: .deploy-tools/node_modules/.bin/vercel promote "$(cat deployment-url.txt)" --yes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deployment-jeux-rpg
          path: deployment-url.txt
