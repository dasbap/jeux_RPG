name: Lint et syntaxe
on:
  push:
    branches: [master, prod]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m compileall -q jeuxRPG main.py app.py scripts
      - run: python -m pip install ruff==0.16.10
      - run: python -m ruff check jeuxRPG
