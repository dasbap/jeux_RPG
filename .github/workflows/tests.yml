name: Tests du moteur et du POC
on:
  push:
    branches: [master, prod]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  builder:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt '.[test]'
      - run: python -m pytest test/test_map_layout_editor.py -q
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      RPG_TEST_REDIS_URL: redis://127.0.0.1:6379
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c constraints.txt '.[test]'
      - if: matrix.python-version == '3.12'
        run: python -m pip install pytest-cov==7.1.0 ruff==0.16.10
      - if: matrix.python-version == '3.12'
        run: python -m pytest -q --cov=jeuxRPG --cov-branch --cov-report=json:coverage.json --cov-report=xml:coverage.xml
      - name: Verifier le chiffrement de sauvegarde sur une fixture
        if: matrix.python-version == '3.12'
        run: |
          sudo apt-get update && sudo apt-get install --yes age
          umask 077
          age-keygen -o "$RUNNER_TEMP/fixture.key" 2>/dev/null
          age-keygen -y "$RUNNER_TEMP/fixture.key" > "$RUNNER_TEMP/fixture.recipient"
          printf 'fixture de restauration' > "$RUNNER_TEMP/fixture.txt"
          age -R "$RUNNER_TEMP/fixture.recipient" -o "$RUNNER_TEMP/fixture.age" "$RUNNER_TEMP/fixture.txt"
          age -d -i "$RUNNER_TEMP/fixture.key" -o "$RUNNER_TEMP/fixture-restored.txt" "$RUNNER_TEMP/fixture.age"
          cmp "$RUNNER_TEMP/fixture.txt" "$RUNNER_TEMP/fixture-restored.txt"
      - if: matrix.python-version == '3.12'
        run: python scripts/quality_budget.py --coverage coverage.json
      - if: matrix.python-version != '3.12'
        run: python -m pytest -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.python-version == '3.12'
        with:
          name: coverage-python312
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: ignore
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -c constraints.txt .
      - run: npm install --prefix .ui-test jsdom@26.1.0 playwright@1.56.1 axe-core@4.10.3
      - run: .ui-test/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/verify_transport.cjs
      - run: node scripts/verify_reconnect_endurance.cjs
      - run: node scripts/verify_polling.cjs
      - run: node scripts/verify_ui_retry.cjs
      - run: node scripts/verify_ui_mira.cjs
      - run: node scripts/verify_touch_controls.cjs
      - run: node scripts/verify_map_navigation.cjs
      - run: node scripts/verify_admin_ui.cjs
      - run: python scripts/verify_http_ui.py
        env:
          RPG_VERIFY_HUD_LAYOUT: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hud-captures
          path: hud-captures
          if-no-files-found: ignore
