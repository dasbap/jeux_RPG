name: Tests du moteur et du POC
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  builder:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m pytest test/test_map_layout_editor.py -q
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      RPG_TEST_REDIS_URL: redis://127.0.0.1:6379
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps . --wheel-dir dist
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: npm install --prefix .ui-test jsdom@26.1.0 playwright@1.56.1
      - run: .ui-test/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/verify_transport.cjs
      - run: node scripts/verify_ui_retry.cjs
      - run: node scripts/verify_ui_mira.cjs
      - run: node scripts/verify_touch_controls.cjs
      - run: node scripts/verify_admin_ui.cjs
      - run: python scripts/verify_http_ui.py
        env:
          RPG_VERIFY_HUD_LAYOUT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-captures
          path: hud-captures
          if-no-files-found: ignore
