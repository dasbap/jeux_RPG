name: Installation et lancement
on:
  push:
    branches: [master, prod]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install build pip-audit==2.9.0
      - run: python -m pip_audit --disable-pip --no-deps -r constraints.txt --format json --output dependency-audit.json
      - run: python -m build
      - run: python -m venv /tmp/rpg-install
      - run: /tmp/rpg-install/bin/python -m pip install dist/*.whl
      - working-directory: /tmp
        run: |
          /tmp/rpg-install/bin/jeux-rpg --help
          /tmp/rpg-install/bin/python -c "from jeuxRPG.multiplayer.service import GameService; from jeuxRPG.multiplayer.serverless import Application; from jeuxRPG.multiplayer.turso import TursoConnection; g = GameService('/tmp/rpg-package.sqlite3'); p = g.register('Test', 'Knight'); assert g.state(p['token'])['player']['name'] == 'Test'; g.close()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution
          path: |
            dist/*
            dependency-audit.json
  requirements-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m venv venv
      - run: .\venv\Scripts\python.exe -m pip install -c constraints.txt -r requirements.txt
      - run: .\venv\Scripts\python.exe main.py --help
