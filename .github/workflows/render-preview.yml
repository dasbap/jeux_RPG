name: Render preview validation
on:
  push:
    branches:
      - migration/render-single-d1
  pull_request:
    paths:
      - 'deploy/render/**'
      - '.dockerignore'
      - 'jeuxRPG/**'
      - 'pyproject.toml'
      - 'constraints.txt'
      - 'scripts/prepare_render_preview.py'
      - 'test/test_render_host.py'
      - 'render.yaml'
      - '.github/workflows/render-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt '.[test]'
      - run: python -m pytest test/test_render_host.py test/test_single_runtime.py test/test_oracle_host.py test/test_d1_client.py -q
      - name: Construire sans secrets ni connexion D1
        run: docker build --file deploy/render/Dockerfile --tag jeux-rpg-preview:test .
      - name: Verifier le paquet et le refus de demarrage sans secrets
        run: |
          docker run --rm --entrypoint python jeux-rpg-preview:test -c 'from jeuxRPG.multiplayer.container_host import configuration; from jeuxRPG.multiplayer.server import CLIENT_STATIC; assert CLIENT_STATIC'
          if docker run --rm jeux-rpg-preview:test; then
            echo 'Le moteur aurait du refuser une configuration absente'
            exit 1
          fi
