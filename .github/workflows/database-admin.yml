name: Administration du stockage
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Controle en lecture seule de la base active
        required: true
        default: connexion
        type: choice
        options: [connexion, schema, integrite]
permissions:
  contents: read
concurrency:
  group: database-administration
  cancel-in-progress: false
jobs:
  administration:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt .
      - name: Verifier, administrer et verifier l'integrite
        env:
          RPG_DATABASE_BACKEND: ${{ vars.RPG_DATABASE_BACKEND || 'turso' }}
          RPG_D1_WORKER_URL: ${{ vars.RPG_D1_WORKER_URL || secrets.RPG_D1_WORKER_URL }}
          RPG_D1_SERVICE_TOKEN: ${{ secrets.RPG_D1_SERVICE_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DATABASE_OPERATION: ${{ inputs.operation }}
        run: |
          case "$DATABASE_OPERATION" in
            connexion|schema|integrite) ;;
            *) echo "Les migrations passent uniquement par la publication avec sauvegarde."; exit 1 ;;
          esac
          python -m scripts.database_admin connexion
          python -m scripts.database_admin "$DATABASE_OPERATION"
          python -m scripts.database_admin integrite
